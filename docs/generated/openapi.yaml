components:
  schemas:
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          description: "Business status code. 0 means ok, non-zero means error."
          format: int32
          example: 0
        message:
          type: string
          description: Message for humans
          example: ok
        data:
          type: object
          description: Response data payload
        timestamp:
          type: integer
          description: Server timestamp in milliseconds
          format: int64
          example: 1700000000000
      description: Standard API response wrapper
    NameOnlyRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: Name
          example: Java
    SiteSettingRequest:
      required:
      - siteName
      type: object
      properties:
        siteName:
          maxLength: 100
          minLength: 0
          type: string
          description: Site name
          example: My Blog
        siteNotice:
          maxLength: 255
          minLength: 0
          type: string
          description: Site notice (displayed on home/detail pages)
          example: Welcome to my blog
        aboutContent:
          maxLength: 20000
          minLength: 0
          type: string
          description: About page content in Markdown
          example: |-
            # About

            This is my blog...
        linksJson:
          maxLength: 2000
          minLength: 0
          type: string
          description: "Friend links as JSON string, e.g. [{\"name\":\"GitHub\",\"\
            url\":\"https://...\"}]"
          example: "[{\"name\":\"GitHub\",\"url\":\"https://github.com/xxx\"}]"
        seoTitle:
          maxLength: 255
          minLength: 0
          type: string
          description: SEO title
          example: My Blog
        seoKeywords:
          maxLength: 255
          minLength: 0
          type: string
          description: SEO keywords
          example: "java,vue,spring"
        seoDescription:
          maxLength: 255
          minLength: 0
          type: string
          description: SEO description
          example: A personal tech blog
        footerText:
          maxLength: 255
          minLength: 0
          type: string
          description: Footer text
          example: Copyright © 2026
        bannerUrl:
          maxLength: 255
          minLength: 0
          type: string
          description: Homepage full-screen banner image URL (under /uploads)
          example: /uploads/202602/banner.jpg
    AdminPostUpdateRequest:
      required:
      - content
      - title
      type: object
      properties:
        title:
          maxLength: 120
          minLength: 0
          type: string
          description: Post title
          example: Hello World
        summary:
          maxLength: 300
          minLength: 0
          type: string
          description: Post summary
          example: A short introduction about this post
        content:
          type: string
          description: Post content in Markdown
          example: |-
            # Heading

            Content...
        coverUrl:
          maxLength: 255
          minLength: 0
          type: string
          description: Cover image URL (usually under /uploads)
          example: /uploads/202602/cover.jpg
        categoryId:
          type: integer
          description: Category id
          format: int64
          example: 1
        tagIds:
          type: array
          description: Tag ids
          example:
          - 1
          - 2
          - 3
          items:
            type: integer
            description: Tag ids
            format: int64
    AdminUserStatusRequest:
      required:
      - status
      type: object
      properties:
        status:
          maximum: 1
          minimum: 0
          type: integer
          description: "Status: 1=enabled, 0=disabled"
          format: int32
          example: 1
          enum:
          - 0
          - 1
    ApiResponseMapStringObject:
      type: object
      properties:
        code:
          type: integer
          description: "Business status code. 0 means ok, non-zero means error."
          format: int32
          example: 0
        message:
          type: string
          description: Message for humans
          example: ok
        data:
          type: object
          additionalProperties:
            type: object
            description: Response data payload
          description: Response data payload
        timestamp:
          type: integer
          description: Server timestamp in milliseconds
          format: int64
          example: 1700000000000
      description: Standard API response wrapper
    AdminUserResetPasswordRequest:
      required:
      - newPassword
      type: object
      properties:
        newPassword:
          maxLength: 100
          minLength: 6
          type: string
          description: New password
          example: "123456"
    CommentCreateRequest:
      required:
      - content
      - nickname
      type: object
      properties:
        nickname:
          maxLength: 30
          minLength: 0
          type: string
          description: Nickname displayed on comment
          example: Tom
        email:
          maxLength: 100
          minLength: 0
          type: string
          description: "Email (optional). Used for contact only, not displayed publicly"
          example: tom@example.com
        content:
          maxLength: 500
          minLength: 0
          type: string
          description: Comment content
          example: Nice post!
    ApiResponseLong:
      type: object
      properties:
        code:
          type: integer
          description: "Business status code. 0 means ok, non-zero means error."
          format: int32
          example: 0
        message:
          type: string
          description: Message for humans
          example: ok
        data:
          type: integer
          description: Response data payload
          format: int64
        timestamp:
          type: integer
          description: Server timestamp in milliseconds
          format: int64
          example: 1700000000000
      description: Standard API response wrapper
    ApiResponseUploadResultVO:
      type: object
      properties:
        code:
          type: integer
          description: "Business status code. 0 means ok, non-zero means error."
          format: int32
          example: 0
        message:
          type: string
          description: Message for humans
          example: ok
        data:
          $ref: '#/components/schemas/UploadResultVO'
        timestamp:
          type: integer
          description: Server timestamp in milliseconds
          format: int64
          example: 1700000000000
      description: Standard API response wrapper
    UploadResultVO:
      type: object
      properties:
        url:
          type: string
          description: Public URL
          example: /uploads/202602/xxx.jpg
        originalName:
          type: string
          description: Original file name
          example: banner.jpg
        size:
          type: integer
          description: File size in bytes
          format: int64
          example: 12345
        contentType:
          type: string
          description: Content type
          example: image/jpeg
      description: Upload result
    AdminPostCreateRequest:
      required:
      - content
      - title
      type: object
      properties:
        title:
          maxLength: 120
          minLength: 0
          type: string
          description: Post title
          example: Hello World
        summary:
          maxLength: 300
