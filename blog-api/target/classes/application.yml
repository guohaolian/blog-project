server:
  port: 8080

spring:
  application:
    name: blog-api
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    docExpansion: none
  api-docs:
    path: /v3/api-docs

  # 分组：Swagger UI 左上角可以切换分组查看（更像“前台/管理端”两个产品）
  group-configs:
    - group: web
      paths-to-match:
        - /api/**
      paths-to-exclude:
        - /api/admin/**
    - group: admin
      paths-to-match:
        - /api/admin/**
