spring:
  application:
    name: blog-api
  profiles:
    active: prod

  datasource:
    # MySQL 5.5: use `com.mysql.jdbc.Driver` (mysql-connector-java 5.x)
    #建议生产上设置 serverTimezone，避免时区警告/时间偏移
    url: jdbc:mysql://127.0.0.1:3306/blog_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowMultiQueries=true&serverTimezone=UTC
    username: root
    password: ghl200224
    driver-class-name: com.mysql.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      # 你前面提到过 file too large(max 5MB)，这里统一改成 10MB
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    # 生产部署通常由 Nginx 负责 /uploads 映射；Spring 保持默认即可
    throw-exception-if-no-handler-found: false

  web:
    resources:
      add-mappings: true

app:
  jwt:
    # 生产环境务必改成强随机字符串（至少 32+ 字符）
    secret: change-me-in-prod
    # 1 天
    expire-seconds: 86400
  upload:
    # Nginx 里 /uploads -> /opt/blog/uploads
    dir: /opt/blog/uploads

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.example.blog: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
